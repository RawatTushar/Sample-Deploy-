services:
  blue:
    image: ${BLUE_IMAGE}
    container_name: blue
    environment:
        APP-VERSION: 1.0
    networks:
      - app-network
    
  green:
    image: ${GREEN_IMAGE}
    networks:
      - app-network
    container_name: green
    environment:
        APP-VERSION: 1.0
     
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
