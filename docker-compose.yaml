
services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: node-app
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
